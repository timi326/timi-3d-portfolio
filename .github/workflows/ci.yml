name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-sunset-room.mjs sunset-editable-web.glb
      - run: node scripts/check-scene-editor.mjs
      - run: node scripts/check-telescope.mjs
      - run: node scripts/check-avatar-pose.mjs
      - run: node scripts/check-rewind-game.mjs
      - run: node scripts/check-timi-chat.mjs
      - run: node server/conversations.test.mjs
